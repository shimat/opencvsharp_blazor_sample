name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-sample
        with:
          dotnet-version: '11.0.100'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Debug

      - name: Test
        run: dotnet test BlazorApp.Tests/BlazorApp.Tests.csproj --no-build -c Debug

  release-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-sample
        with:
          dotnet-version: '11.0.100'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish Release with partial AOT
        shell: bash
        run: |
          dotnet --version
          project=BlazorApp/BlazorApp.csproj
          dotnet restore "$project" --source https://api.nuget.org/v3/index.json
          dotnet msbuild "$project" -getItem:NativeFileReference |
            jq -er '.Items.NativeFileReference | select(length == 1) | .[0].FullPath | select(endswith("/runtimes/browser-wasm/6.0.2/OpenCvSharpExtern.a"))'
          dotnet publish "$project" --no-restore -c Release -o publish-output 2>&1 | tee "$RUNNER_TEMP/publish.log"
          grep -E 'BlazorApp\.dll -> .*\.bc' "$RUNNER_TEMP/publish.log"
          if grep -E 'undefined symbol: (saveSetjmp|testSetjmp)' "$RUNNER_TEMP/publish.log"; then
            echo "OpenCvSharpExtern.a refers to legacy Emscripten setjmp helpers" >&2
            exit 1
          fi
          if grep -E 'OpenCvSharp\.dll -> .*\.bc' "$RUNNER_TEMP/publish.log"; then
            echo "OpenCvSharp.dll must run in the interpreter" >&2
            exit 1
          fi

      - name: Test the published app in Google Chrome
        run: |
          test_dir="$RUNNER_TEMP/published-app-test"
          npm install --prefix "$test_dir" --no-save --no-package-lock playwright@1.65.1
          cp .github/scripts/{test-published-app,verify-samples}.mjs "$test_dir/"
          node "$test_dir/test-published-app.mjs" publish-output/wwwroot
